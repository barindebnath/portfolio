<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        const stored = localStorage.getItem("portfolio:theme");
        const theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        if (theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.removeAttribute("data-theme");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <meta
      name="description"
      content="Barin Debnath — Senior Software Engineer. I build scalable, high-performance frontend systems with React, TypeScript, and modern web tech."
    />
    <meta
      property="og:title"
      content="Barin Debnath — Senior Software Engineer"
    />
    <meta
      property="og:description"
      content="Senior Software Engineer specializing in React, TypeScript, and high-performance frontend systems."
    />
    <meta
      property="og:url"
      content="https://barindebnath.github.io/portfolio"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Barin Debnath — Senior Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
